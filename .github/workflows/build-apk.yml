 
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            echo "Upload index.html to the repository root first (Add file > Upload files), then re-run this workflow."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="podcast-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the podcasts app file (podcast-app marker missing)."
            echo "Upload the podcasts index.html to the repository root, then re-run this workflow."
            exit 1
          fi

          mkdir -p app/src/main/java/com/lynxospodcasts/app app/src/main/assets/www

          cp "$HTML_FILE" app/src/main/assets/www/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LynxosPodcastsApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.lynxospodcasts.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lynxospodcasts.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Lynxos Podcasts"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.lynxospodcasts.app.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name="com.lynxospodcasts.app.EpisodeCheckReceiver"
                      android:exported="false" />
                  <receiver
                      android:name="com.lynxospodcasts.app.BootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lynxospodcasts/app/MainActivity.java <<'EOF'
          package com.lynxospodcasts.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  EpisodeCheckReceiver.schedule(this);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  final Activity self = this;
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void set(String key, String value) {
                          try {
                              getSharedPreferences("lynxos_podcasts", MODE_PRIVATE).edit().putString(key, value).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String get(String key) {
                          try {
                              return getSharedPreferences("lynxos_podcasts", MODE_PRIVATE).getString(key, null);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void remove(String key) {
                          try {
                              getSharedPreferences("lynxos_podcasts", MODE_PRIVATE).edit().remove(key).commit();
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) {
                                  ttsReady = false;
                              }
                              if (ttsReady && pendingTts != null) {
                                  String text = pendingTts;
                                  pendingTts = null;
                                  try {
                                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "podcasts-reader");
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (text == null) return;
                          if (ttsReady && tts != null) {
                              try {
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "podcasts-reader");
                              } catch (Exception ignored) {}
                          } else {
                              pendingTts = text;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try {
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void cancel() {
                          stop();
                      }
                  }, "LynxosTts");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void requestExemption() {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                              Uri.parse("package:" + getPackageName()));
                                      startActivity(i);
                                  } catch (Exception e) {
                                      try {
                                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                                      } catch (Exception ignored) {}
                                  }
                              }
                          });
                      }
                  }, "LynxosBattery");
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      try {
                          tts.stop();
                          tts.shutdown();
                      } catch (Exception ignored) {}
                      tts = null;
                  }
                  super.onDestroy();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/lynxospodcasts/app/EpisodeCheckReceiver.java <<'EOF'
          package com.lynxospodcasts.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class EpisodeCheckReceiver extends BroadcastReceiver {
              private static final long INTERVAL_MS = 6L * 60L * 60L * 1000L;
              private static final String PREFS = "lynxos_podcasts";
              private static final String CHANNEL_ID = "podcast-episodes";

              public static void schedule(Context ctx) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent i = new Intent(ctx, EpisodeCheckReceiver.class);
                      PendingIntent pi = PendingIntent.getBroadcast(ctx, 0, i,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      long trigger = System.currentTimeMillis() + INTERVAL_MS;
                      am.setInexactRepeating(AlarmManager.RTC_WAKEUP, trigger, INTERVAL_MS, pi);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  final PendingResult pr = goAsync();
                  final Context appCtx = context.getApplicationContext();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              doCheck(appCtx);
                          } catch (Exception ignored) {
                          } finally {
                              try { schedule(appCtx); } catch (Exception ignored) {}
                              pr.finish();
                          }
                      }
                  }).start();
              }

              private void doCheck(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String subsJson = prefs.getString("pod_subs", null);
                  if (subsJson == null || subsJson.length() == 0) return;
                  List<String[]> found = new ArrayList<String[]>();
                  try {
                      JSONArray subs = new JSONArray(subsJson);
                      for (int i = 0; i < subs.length(); i++) {
                          JSONObject s = subs.getJSONObject(i);
                          String feed = s.optString("feed", "");
                          String name = s.optString("name", "Podcast");
                          if (feed.length() == 0) continue;
                          try {
                              String api = "https://api.rss2json.com/v1/api.json?rss_url=" + URLEncoder.encode(feed, "UTF-8");
                              JSONObject d = new JSONObject(httpGet(api));
                              JSONArray items = d.optJSONArray("items");
                              if (items == null || items.length() == 0) continue;
                              JSONObject latest = items.getJSONObject(0);
                              String pub = latest.optString("pubDate", "");
                              if (pub.length() == 0) continue;
                              long pubMs = parseDate(pub);
                              if (pubMs == 0) continue;
                              String key = "pod_lastseen:" + feed;
                              long seen = prefs.getLong(key, 0);
                              if (seen == 0) {
                                  prefs.edit().putLong(key, pubMs).apply();
                              } else if (pubMs > seen) {
                                  prefs.edit().putLong(key, pubMs).apply();
                                  found.add(new String[]{name, latest.optString("title", "New episode")});
                              }
                          } catch (Exception ignored) {}
                      }
                  } catch (Exception ignored) {}
                  if (found.size() == 1) {
                      notifyNew(ctx, "New episode: " + found.get(0)[0], found.get(0)[1]);
                  } else if (found.size() > 1) {
                      notifyNew(ctx, found.size() + " new podcast episodes", "Tap to open Lynxos Podcasts");
                  }
              }

              private long parseDate(String pub) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("EEE, dd MMM yyyy HH:mm:ss z", Locale.US);
                      Date dt = f.parse(pub);
                      return dt != null ? dt.getTime() : 0;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private String httpGet(String urlStr) throws Exception {
                  HttpURLConnection c = null;
                  try {
                      URL url = new URL(urlStr);
                      c = (HttpURLConnection) url.openConnection();
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", "LynxosPodcasts/1.0");
                      BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                      br.close();
                      return sb.toString();
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              private void notifyNew(Context ctx, String title, String text) {
                  try {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "New episodes", NotificationManager.IMPORTANCE_DEFAULT);
                          nm.createNotificationChannel(ch);
                      }
                      Intent open = new Intent(ctx, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                              ? new Notification.Builder(ctx, CHANNEL_ID)
                              : new Notification.Builder(ctx);
                      nb.setContentTitle(title)
                        .setContentText(text)
                        .setSmallIcon(android.R.drawable.ic_dialog_info)
                        .setContentIntent(pi)
                        .setAutoCancel(true);
                      nm.notify(1001, nb.build());
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/lynxospodcasts/app/BootReceiver.java <<'EOF'
          package com.lynxospodcasts.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      EpisodeCheckReceiver.schedule(context.getApplicationContext());
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lynxos-podcasts-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
